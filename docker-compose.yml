version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safebus-web
    ports:
      - "5050:5050"
      - "80:5050"
    restart: always
    environment:
      - PORT=5050

  api:
    build:
      context: ./EduBus.Api
      dockerfile: Dockerfile
    container_name: safebus-api
    ports:
      - "5000:8080"
    restart: always
